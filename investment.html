<section class="s"><div class="c"><div class="g3" id="sg">${[['search','Self-Service','Check Pension Status','View monthly crediting dates, historical disbursement slips, and statutory deductions online with ease.','Open Status Checker',[0,1]],['usr','Secure Portal','Update Banking Particulars','Safely change your recipient bank account, residential address, or primary phone number.','Update Details',[1]],['calc','Calculator','Plan Your Retirement','Use the interactive retirement pension estimator to calculate prospective gratuity and monthly entitlement.','Calculate Estimate',[2]],['dl','PDF & Guides','Forms & Official Downloads','Download verified JPA and KWAP authorization forms, statutory declarations, and direct debit kits.','Browse Forms',[0,1,3]],['ph','iOS & Android','Get the MyPesara App','Carry your digital pensioner ID card, discount privileges, and instant payment alerts everywhere.','Download App',[0,1]],['heart','Welfare Care','Derivative Pension Claims','Compassionate assistance for spouses and eligible dependents navigating derivative pension transition.','View Guide & Steps',[1,3]]].map(s=>`<div class="sv" data-a="${s[5]}"><div class="tp2"><span class="ic">${I(s[0])}</span><span class="tag">${s[1]}</span></div><h3>${s[2]}</h3><p>${s[3]}</p><div class="go"><button data-x="${s[2]}">${s[4]} ${I('arr')}</button></div></div>`).join('')}</div></div></section>
<section class="s sky" style="border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)"><div class="c"><div class="ctr"><h2 class="t">Three simple steps to manage your pension</h2><p class="sub">We keep statutory procedures easy to understand with clear guidance at every stage.</p></div><div class="g3" style="margin-top:30px">${[['Have your MyKad ready','Your 12-digit Malaysian MyKad number is your single official key to verify disbursements and JPA files.','No complex password required'],['Select Your Self-Service Task','Check pension payment records, download verified PDF slips, or submit an updated bank account.','Instant online confirmation'],['Receive Punctual Disbursement','Monthly pensions are credited safely into your chosen bank account around the 15th of each month.','Direct SMS & app notifications']].map((s,i)=>`<div class="st"><div class="n">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p><b>${s[2]}</b></div>`).join('')}</div></div></section>
<section class="s"><div class="c"><div class="ctr"><h2 class="t">Frequently Asked Questions</h2><p class="sub">Plain language answers to common pension queries. Need further help? Our hotline is always ready.</p></div><div class="faq">${[['When is the civil service pension credited into bank accounts every month?','Pension disbursements generally take place between the 15th and 20th of each calendar month, or earlier if festive holidays (such as Hari Raya Aidilfitri, Chinese New Year, Deepavali, or Christmas) coincide with the week. You can view the complete annual schedule on our portal or via the MyPesara mobile application.'],['How do I update my bank account if I switch to a different commercial bank?','Sign in to the secure portal with your MyKad number, choose Update Banking Particulars, and submit the new account details. You will receive an instant online confirmation.'],['Who is eligible to receive a derivative pension upon the passing of a pensioner?','Eligible spouses and dependents may claim a derivative pension. Please see the Derivative Pension Claims guide or call our hotline for the full list of requirements.']].map((f,i)=>`<div class="fq ${i?'':'open'}"><button aria-expanded="${!i}">${f[0]}${I('dn')}</button><div>${f[1]}</div></div>`).join('')}</div>
<div class="cta"><div><h2>Prefer speaking to a friendly officer?</h2><p>Our dedicated pensioner hotline is open Monday to Friday, 8:30 AM to 5:30 PM. We assist with patience, respect, and clear answers.</p></div><div class="bs"><a class="btn b-o" href="tel:+60321748000">${I('tel')} +603 2174 8000</a><a class="btn b-ol" href="contact.html">${I('mail')} Send a Message</a></div></div></div></section>`;

  $('#app').innerHTML=header(r)+'<main>'+V[r]()+'</main>'+footer();document.title=({home:'Home',services:'Pensioner Services',investment:'Investment & Solvency',newsroom:'Newsroom',contact:'Contact & Locations'})[r]+' | KWAP';
  scrollTo(0,0);shared();({home:initHome,services:initSvc,investment:initInv,newsroom:initNews,contact:initContact})[r]()}
function shared(){
  $('#bg').onclick=()=>$('#mob').classList.toggle('on');
  $('#gs').onsubmit=e=>{e.preventDefault();const q=e.target.querySelector('input').value.trim();sessionStorage.q=q;if(PAGE=='newsroom')render();else location.href='newsroom.html'};
  $('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});$('#ch').onclick=()=>$('#cb').classList.toggle('on');
  $$('.lang').forEach(b=>b.onclick=()=>toast('Language switching is not included in this prototype'));
  $$('[data-x]').forEach(a=>a.onclick=()=>toast(a.dataset.x+': outside this prototype’s five pages'));
  $$('[data-n]').forEach(a=>a.onclick=()=>{const n=news[a.dataset.n];toast('Opening: '+n[1].slice(0,50)+'... (full article not in prototype)')})}
function initHome(){let i=0,t;const d=$('#dots');d.innerHTML=slides.map((_,k)=>`<i data-k="${k}"></i>`).join('');
  const go=n=>{i=(n+slides.length)%slides.length;const s=slides[i];$('#h1').textContent=s[0];$('#hp').textContent=s[1];$('#hb').innerHTML=s[2]+' '+I('arr');$('#hb').href=s[3]+'.html';$$('i',d).forEach((x,k)=>x.classList.toggle('on',k==i))};go(0);
  $('.arr.l').onclick=()=>go(i-1);$('.arr.r').onclick=()=>go(i+1);d.onclick=e=>e.target.dataset.k&&go(+e.target.dataset.k);
  const sv=$('#lc'),x=k=>80+k*160,y=v=>200-(v-5.5)*80;let h='<g font-size="12" fill="#9db8ff"><text x="10" y="'+(y(8))+'">8%</text><text x="10" y="'+y(7)+'">7%</text><text x="10" y="'+y(6)+'">6%</text></g>';
  h+=`<path d="M${pyr.map((p,k)=>x(k)+','+y(p[1])).join(' L')}" fill="none" stroke="#ffa400" stroke-width="3"/>`;
  pyr.forEach((p,k)=>h+=`<g class="pt" data-k="${k}" style="cursor:pointer" tabindex="0"><circle cx="${x(k)}" cy="${y(p[1])}" r="12" fill="transparent"/><circle cx="${x(k)}" cy="${y(p[1])}" r="5" fill="#ffa400"/><text x="${x(k)}" y="${y(p[1])-14}" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">${p[1]}%</text><text x="${x(k)}" y="216" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">${p[0]}</text></g>`);sv.innerHTML=h;
  const sel=k=>{$('#ln').innerHTML=k==4?'<b>2025:</b> Fund AUM grew to RM 184.5B with a verified net yield of 7.2%.':`<b>${pyr[k][0]}:</b> Verified net investment return of ${pyr[k][1]}% p.a.`;$$('.pt circle:nth-child(2)',sv).forEach((c,j)=>c.setAttribute('r',j==k?8:5))};sel(4);
  $$('.pt',sv).forEach(g=>{g.onclick=()=>sel(+g.dataset.k);g.onkeydown=e=>e.key=='Enter'&&sel(+g.dataset.k)});
  const c=$('#car'),w=()=>c.firstElementChild.offsetWidth+18;let all=news.slice(0,4);$('#nn').onclick=()=>c.scrollBy(w(),0);$('#np').onclick=()=>c.scrollBy(-w(),0)}
function initSvc(){$$('#aud button').forEach((b,k)=>b.onclick=()=>{$$('#aud button').forEach(x=>x.classList.toggle('on',x==b));let n=0;$$('.sv').forEach(s=>{const ok=!k||s.dataset.a.split(',').includes(String(k-1+1)==='0'?'0':String(k));s.style.display=ok?'':'none';n+=ok});});
  $$('.fq button').forEach(b=>b.onclick=()=>{const f=b.parentElement,o=!f.classList.contains('open');f.classList.toggle('open',o);b.setAttribute('aria-expanded',o)})}
const al=[['Domestic Public Equities','RM77.5B',42,'#1a0ea8'],['Fixed Income & Sovereign Bonds','RM64.6B',35,'#0e9aa7'],['Global Private Equity & Alternatives','RM18.5B',10,'#ffa400'],['Real Estate & Prime Infrastructure','RM16.6B',9,'#6aaee0'],['Cash & Short-Term Money Market','RM7.3B',4,'#111827']];
function initInv(){const R=[['FY 2021',6.1],['FY 2022',5.8],['FY 2023',6.9],['FY 2024',6.5],['FY 2025',7.2]];let n=5,tb=false;
  const draw=()=>{const d=R.slice(5-n);$('#bc').innerHTML=tb?`<table class="dt"><tr><th>Year</th><th>KWAP net return</th><th>Actuarial benchmark</th></tr>${d.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}%</td><td>5.0%</td></tr>`).join('')}</table>`:`<div class="bars" role="img" aria-label="Bar chart">${d.map(r=>`<div class="bg"><i style="height:${r[1]/7.5*100}%" title="${r[1]}%"></i><i class="o" style="height:${5/7.5*100}%" title="5.0%"></i></div>`).join('')}</div><div class="bl">${d.map(r=>`<span>${r[0]}</span>`).join('')}</div>`;$('#vt').lastChild.textContent=tb?' View as Chart':' View as Table'};draw();
  $$('#rng button').forEach((b,k)=>b.onclick=()=>{n=[1,3,5][k];$$('#rng button').forEach(x=>x.classList.toggle('on',x==b));draw()});$('#vt').onclick=()=>{tb=!tb;draw()};
  const dn=$('#dn');let a=-90,h='';const C=2*Math.PI*70;let off=0;al.forEach((s,k)=>{const l=C*s[2]/100;h+=`<circle class="sl" data-k="${k}" cx="100" cy="100" r="70" fill="none" stroke="${s[3]}" stroke-width="26" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l});
  dn.innerHTML=h+'<circle cx="100" cy="100" r="50" fill="#fff"/><text x="100" y="90" text-anchor="middle" font-size="9" fill="#5b6472">TOTAL AUM</text><text id="dc" x="100" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#1a0ea8">RM 184.5B</text><text id="ds" x="100" y="122" text-anchor="middle" font-size="8" fill="#5b6472">Total Fund</text>';
  $('#al').innerHTML=al.map((s,k)=>`<div class="al" data-k="${k}" tabindex="0"><i style="background:${s[3]}"></i>${s[0]}<span>${s[1]}</span><b>${s[2]}%</b></div>`).join('');
  const pick=k=>{$$('.al').forEach((e,j)=>e.classList.toggle('on',j==k));$$('.sl').forEach((e,j)=>e.setAttribute('stroke-width',j==k?32:26));$('#dc').textContent=k<0?'RM 184.5B':al[k][1].replace('RM','RM ');$('#ds').textContent=k<0?'Total Fund':al[k][2]+'% of fund'};
  $$('.al').forEach(e=>{e.onclick=()=>pick(e.classList.contains('on')?-1:+e.dataset.k);e.onkeydown=ev=>ev.key=='Enter'&&e.click()});
  $$('[data-dl]').forEach(b=>b.onclick=()=>toast('Prototype: PDF not bundled. “'+b.dataset.dl.slice(0,40)+'...” would download here.'))}
function initNews(){let cat='All News',pg=1,q=sessionStorage.q||'';sessionStorage.q='';$('#nq').value=q;const per=4;
  const draw=()=>{const f=news.filter(n=>(cat=='All News'||n[3]==cat||(cat=='Annoucements'&&n[3]=='Announcements')||(cat=='Reports & Solvency'&&n[3]=='Reports'))&&(n[1]+n[2]).toLowerCase().includes(q.toLowerCase()));const pages=Math.max(1,Math.ceil(f.length/per));pg=Math.min(pg,pages);
    $('#nl').innerHTML=f.slice((pg-1)*per,pg*per).map(n=>`<article class="nw"><div class="ph" style="background:url(${NI[news.indexOf(n)]}) center/cover,linear-gradient(135deg,${n[4]},${n[5]})"></div><div class="bd"><small>${n[0]}</small><h3>${n[1]}</h3><p>${n[2]}</p><a class="rl" data-n="${news.indexOf(n)}">Read Full Notice ${I('arr')}</a></div></article>`).join('');$('#ne').style.display=f.length?'none':'block';
    $('#pg').innerHTML=`<button data-p="-1" aria-label="Previous page">${I('lf')}</button>${Array.from({length:pages},(_,k)=>`<button data-p="${k+1}" class="${k+1==pg?'on':''}">${k+1}</button>`).join('')}<button data-p="+1" aria-label="Next page">${I('rt')}</button>`;
    $$('#pg button').forEach(b=>b.onclick=()=>{const v=b.dataset.p;pg=v=='-1'?Math.max(1,pg-1):v=='+1'?Math.min(pages,pg+1):+v;draw();scrollTo({top:$('#nf').offsetTop-100,behavior:'smooth'})});shared2()};
  const shared2=()=>$$('[data-n]').forEach(a=>a.onclick=()=>toast('Opening: '+news[a.dataset.n][1].slice(0,50)+'... (full article not in prototype)'));
  $$('#nf button').forEach(b=>b.onclick=()=>{cat=b.textContent;pg=1;$$('#nf button').forEach(x=>x.classList.toggle('on',x==b));draw()});$('#nq').oninput=e=>{q=e.target.value;pg=1;draw()};draw()}
function initContact(){const f=$('#cf'),E=(k,m)=>{const e=$(`[data-e=${k}]`);e.textContent=m;const i=$('#'+k);i&&i.classList.toggle('er',!!m&&k!='cn')};
  f.onsubmit=e=>{e.preventDefault();let ok=true;const chk=(k,m,t)=>{const bad=t();E(k,bad?m:'');if(bad)ok=false};
    chk('fn','Enter your full name as shown on your MyKad.',()=>!$('#fn').value.trim());chk('em','Enter a valid email address, e.g. name@example.com.',()=>!/^\S+@\S+\.\S+$/.test($('#em').value));
    chk('pn','Phone number should have 9 to 11 digits.',()=>$('#pn').value&&!/^\d{9,11}$/.test($('#pn').value.replace(/[\s-]/g,'')));chk('tp','Select an enquiry topic.',()=>!$('#tp').value);chk('cn','Tick the consent box to send your enquiry.',()=>!$('#cn').checked);
    if(ok){f.reset();toast('Enquiry sent (simulated). KWAP officers will reply by email.')}else $('.er')?.focus()};
  $$('#cf .f').forEach(i=>i.oninput=()=>E(i.id,''))}
render();
</script></body></html>
